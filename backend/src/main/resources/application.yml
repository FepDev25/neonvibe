spring:
  application:
    name: neonvibe

  # Datasource defaults (production-oriented). Values injected via env vars;
  # never hardcode secrets here.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    property-naming-strategy: SNAKE_CASE

  mvc:
    throw-exception-if-no-handler-found: true
    contentnegotiation:
      media-types:
        webmanifest: application/manifest+json

  servlet:
    multipart:
      # Covers are validated to 10MB in CoverController; audio uploads (single
      # tracks/albums or a ZIP) can legitimately be much larger. Cloudflare's
      # free plan caps a request at 100MB — large batches go via the incoming
      # folder (SFTP/rsync) instead.
      max-file-size: 512MB
      max-request-size: 512MB

# OpenAPI / Swagger UI (dev). Disabled in prod (application-prod.yml).
# NOTE: `springdoc.*` is a root-level property; it must NOT be nested under
# `spring:` or the settings are silently ignored.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# NeonVibe custom configuration (see AGENTS.md section 10)
neonvibe:
  jwt:
    # 256-bit secret for HS256. Injected via env (JWT_SECRET) with NO fallback, so
    # the app fails fast instead of starting with a known/guessable key. Dev and
    # test profiles provide their own value.
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days
  # Comma-separated admin allowlist. Empty = any authenticated user is admin
  # (dev); production requires it (see ProdStartupGuard).
  admin-emails: ${ADMIN_EMAILS:}
  auth:
    google:
      # true (default): validate id_token against Google. false: dev/test mock.
      enabled: ${GOOGLE_AUTH_ENABLED:true}
      tokeninfo-url: https://oauth2.googleapis.com/tokeninfo
      # OAuth 2.0 Web client id. Required to verify the token's `aud` claim;
      # without it, tokens minted for other Google apps would be accepted.
      client-id: ${GOOGLE_CLIENT_ID:}
    # Comma-separated email allowlist. Empty = anyone with a Google account can
    # register (dev only). Required in prod — see ProdStartupGuard.
    allowed-emails: ${ALLOWED_EMAILS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  music:
    paths: /srv/Music
    supported-formats: mp3,flac,aac,ogg,m4a,wav
    scan-interval-seconds: 0
    # Web uploads land here first (outside the watched roots), then are moved
    # into the library. Blank => <java.io.tmpdir>/neonvibe-staging.
    staging-path: ${MUSIC_STAGING:}
    # Drop folder inside the library for SFTP/rsync batches. Blank => <root>/incoming.
    incoming-path: ${MUSIC_INCOMING:}
    # Periodic sweep of the drop folder (seconds; 0 disables). WatchService can
    # miss events, so this reliably organizes dropped files without a manual scan.
    incoming-scan-interval-seconds: ${MUSIC_INCOMING_INTERVAL:60}
  covers:
    cache-path: ./data/covers
    max-size-mb: 500
    retry-days: 7
  lyrics:
    cache-path: ./data/lyrics
  lastfm:
    api-key: ${LASTFM_API_KEY:}
    api-secret: ${LASTFM_API_SECRET:}
  # Web Push (native notifications). Empty keys => feature disabled.
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@neonvibe.local}
  # Transcodificación on-demand a AAC (quality selector). Requiere FFmpeg; si no
  # está disponible, se sirve siempre el original.
  transcode:
    enabled: ${TRANSCODE_ENABLED:true}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    cache-path: ${TRANSCODE_CACHE:./data/transcode}
    max-cache-mb: ${TRANSCODE_MAX_CACHE_MB:2048}
    max-concurrent: ${TRANSCODE_MAX_CONCURRENT:1}
    timeout-seconds: ${TRANSCODE_TIMEOUT:300}
  frontend-base: ${FRONTEND_BASE:http://localhost:5173}
  websocket:
    allowed-origins: "*"

logging:
  level:
    root: INFO
